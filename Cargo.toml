[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
cursor-core = { path = "crates/core" }
color_quant = "1.1"
gif = "0.13"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[profile.dev]
opt-level = 2
