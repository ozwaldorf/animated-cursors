<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor Previews</title>
<style>
  :root { --bg: #f4f2f8; --fg: #1d1b20; --muted: #625b71; --line: #d8d2e4; --tile: #555555; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141218; --fg: #e6e0e9; --muted: #a59eb4; --line: #2f2a36; color-scheme: dark; } }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 0; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 36px; }
  h1 { font: 600 2rem/1.1 system-ui, sans-serif; margin: 0; }
  h2 { font: 600 1.4rem system-ui, sans-serif; margin: 0 0 4px; }
  h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  p { margin: 0; color: var(--muted); max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  figure { margin: 0; display: grid; gap: 6px; }
  img { width: 100%; aspect-ratio: 1; background: var(--tile); border-radius: 14px; }
  figcaption { font: 500 .78rem ui-monospace, monospace; }
</style>
